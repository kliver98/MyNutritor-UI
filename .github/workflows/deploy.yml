name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'deploy/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Rama a desplegar (déjalo vacío para usar la rama seleccionada en "Use workflow from")'
        required: false
        default: 'main'
        type: string
      base_path:
        description: 'Ruta base (BASE_PATH) de la app para GitHub Pages (ej. /MyNutritor-UI)'
        required: false
        default: '/MyNutritor-UI'
        type: string
      skip_tests:
        description: 'Omitir pruebas unitarias y linters (despliegue rápido manual)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event.inputs.branch != '' && github.event.inputs.branch) || github.ref }}

      - name: Display deployment context
        run: |
          echo "=================================================="
          echo "🚀 Evento: ${{ github.event_name }}"
          echo "🌿 Rama de ejecución: ${{ github.ref_name }}"
          echo "🎯 Rama a compilar: ${{ (github.event.inputs.branch != '' && github.event.inputs.branch) || github.ref_name }}"
          echo "📦 Commit SHA: ${{ github.sha }}"
          echo "=================================================="

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
        run: npm run lint

      - name: Type check
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
        run: npm run check

      - name: Run unit & component tests
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
        run: npm run test:run

      - name: Build static site
        run: npm run build
        env:
          BASE_PATH: ${{ inputs.base_path || vars.BASE_PATH || '/MyNutritor-UI' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL || 'https://my-nutritor-be-74319366403.us-central1.run.app' }}
          VITE_APP_ENV: ${{ vars.VITE_APP_ENV || 'production' }}
          VITE_API_TIMEOUT_MS: ${{ vars.VITE_API_TIMEOUT_MS || '15000' }}

      - name: Deploy to gh-pages branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          commit_message: "Deploy from ${{ (inputs.branch != '' && inputs.branch) || github.ref_name }} (${{ github.sha }}) [skip ci]"

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build'

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
